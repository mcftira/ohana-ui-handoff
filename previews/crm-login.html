  <aside class="preview-note"><p><strong>UI-minta.</strong> Ez nem valódi belépési oldal. Ne adj meg jelszót.</p><nav aria-label="Előnézetek"><a href="/">Weboldal</a><a href="/previews/booking-admin.html">Foglalási admin</a><a href="/previews/crm.html">CRM-minta</a></nav></aside>

        <div class="login-actions"><a id="btn-login" class="btn btn-primary" href="/previews/crm.html">Minta megnyitása →</a></div>

      </div>
    </section>
